<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SHO Homepage</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .fir-list-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .page-header h1 {
            color: var(--primary-blue);
            font-size: 32px;
            font-weight: 600;
        }

        .page-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-create {
            background: var(--btn-generate);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn-create:hover {
            background: #4d8f1f;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        .fir-list {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .fir-list-header {
            background: var(--primary-blue);
            color: white;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 150px 150px 200px 120px 150px;
            gap: 15px;
            font-weight: 600;
            font-size: 14px;
        }

        .fir-item {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 150px 150px 200px 120px 150px;
            gap: 15px;
            align-items: center;
            transition: background 0.2s;
        }

        .fir-item:hover {
            background: #f9f9f9;
        }

        .fir-item:last-child {
            border-bottom: none;
        }

        .fir-id {
            font-weight: 600;
            color: var(--primary-blue);
        }

        .fir-type {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .fir-type.regular {
            background: #e3f2fd;
            color: #1976d2;
        }

        .fir-type.zero {
            background: #fff3e0;
            color: #f57c00;
        }

        .fir-status {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

                .fir-status.draft {
            background: #fff3e0;
            color: #f57c00;
        }

        .fir-status.in_progress {
            background: #e3f2fd;
            color: #1976d2;
        }

        .fir-status.completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .fir-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit {
            background: #1976d2;
            color: white;
        }

        .btn-edit:hover {
            background: #1565c0;
        }

        .btn-delete {
            background: #d32f2f;
            color: white;
        }

        .btn-delete:hover {
            background: #c62828;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 64px;
            color: var(--border-color);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 14px;
        }

        @media (max-width: 1200px) {
            .fir-list-header,
            .fir-item {
                grid-template-columns: 1fr 120px 120px 150px 100px 140px;
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            .fir-list-header {
                display: none;
            }

            .fir-item {
                display: block;
                padding: 15px;
            }

            .fir-item > div {
                margin-bottom: 10px;
            }

            .fir-item > div:last-child {
                margin-bottom: 0;
            }

            .fir-mobile-label {
                font-weight: 600;
                color: var(--text-secondary);
                font-size: 12px;
                margin-right: 10px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-overlay"></div>
        <div class="header-container">
            <div class="header-left">
                <div class="brand">
                    <img src="assets/logo.png" alt="Telangana State Police" class="brand-logo">
                    <div class="brand-text">
                        <h3>SHO HOMEPAGE</h3>
                    </div>
                </div>
            </div>

            <div class="header-center">
                <div class="search-bar">
                    <div class="search-input-wrapper">
                        <select class="search-type">
                            <option>FIR</option>
                        </select>
                        <input type="text" placeholder="Search FIR" id="searchInput">
                        <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <div class="user-profile">
                    <div class="user-details">
                        <span class="user-name" id="userName">USER</span>
                        <span class="user-role">STATION HOUSE OFFICER (SHO)</span>
                        <span class="user-loc">Moinabad PS(Cyberabad)</span>
                    </div>
                    <div class="user-avatar-wrapper">
                        <i class="fas fa-user-circle user-avatar"></i>
                        <i class="fas fa-caret-down dropdown-icon"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="fir-list-container">
            <div class="page-header">
                <h1>FIR Records</h1>
                <div class="page-actions">
                    <button class="btn-create" onclick="window.location.href='index.html'">
                        <i class="fas fa-plus"></i> Create New FIR
                    </button>
                    <button class="btn-logout" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="fir-list" id="firList">
                <!-- FIR items will be rendered here -->
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-content">
            DESIGNED AND DEVELOPED BY <span class="company-name">Innoright <span class="solutions">SOLUTIONS</span></span>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        // Check authentication
        if (!AuthService.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        // Display username
        document.getElementById('userName').textContent = AuthService.getUsername().toUpperCase();

        // Render FIR list
        function renderFIRList(firs = null) {
            const firList = document.getElementById('firList');
            const allFIRs = firs || FIRService.getAllFIRs();

            if (allFIRs.length === 0) {
                firList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <h3>No FIR Records Found</h3>
                        <p>Click "Create New FIR" to add your first FIR record</p>
                    </div>
                `;
                return;
            }

            let html = `
                    <div class="fir-list-header">
                    <div>FIR Number</div>
                    <div>Type</div>
                    <div>Status</div>
                    <div>Crime Type</div>
                    <div>Date</div>
                    <div>Actions</div>
                </div>
            `;

            allFIRs.forEach(fir => {
                const date = fir.createdAt ? new Date(fir.createdAt).toLocaleDateString('en-GB') : 'N/A';
                const type = (fir.firType || 'REGULAR').toLowerCase();
                const status = fir.status || 'draft';
                const crimeType = (fir.actsSections && fir.actsSections.crimeType) || fir.crimeType || 'N/A';
                const firNumber = fir.firNumber || 'N/A';

                html += `
                    <div class="fir-item">
                        <div>
                            <span class="fir-mobile-label">FIR Number:</span>
                            <span class="fir-id">${firNumber}</span>
                        </div>
                        <div>
                            <span class="fir-mobile-label">Type:</span>
                            <span class="fir-type ${type === 'zero fir' ? 'zero' : 'regular'}">${fir.firType || 'REGULAR FIR'}</span>
                        </div>
                        <div>
                            <span class="fir-mobile-label">Status:</span>
                            <span class="fir-status ${status}">${status.toUpperCase()}</span>
                        </div>
                        <div>
                            <span class="fir-mobile-label">Crime Type:</span>
                            ${crimeType}
                        </div>
                        <div>
                            <span class="fir-mobile-label">Date:</span>
                            ${date}
                        </div>
                        <div class="fir-actions">
                            <button class="btn-action btn-edit" onclick="editFIR('${fir.id}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteFIR('${fir.id}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            });

            firList.innerHTML = html;
        }

        // Edit FIR
        function editFIR(id) {
            window.location.href = `index.html?id=${id}`;
        }

        // Delete FIR
        function deleteFIR(id) {
            if (confirm('Are you sure you want to delete this FIR record?')) {
                FIRService.deleteFIR(id);
                renderFIRList();
            }
        }

        // Handle logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                AuthService.logout();
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                performSearch();
            }
        });

        document.getElementById('searchBtn').addEventListener('click', performSearch);

        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const allFIRs = FIRService.getAllFIRs();

            if (!searchTerm) {
                renderFIRList();
                return;
            }

            const filtered = allFIRs.filter(fir => {
                return fir.id.toLowerCase().includes(searchTerm) ||
                       (fir.crimeType && fir.crimeType.toLowerCase().includes(searchTerm)) ||
                       (fir.firType && fir.firType.toLowerCase().includes(searchTerm));
            });

            renderFIRList(filtered);
        }

        // Initial render
        renderFIRList();
    </script>
</body>
</html>
